[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "laptop-powercontrol"
dynamic = ["version"]
description = "GTK 4 app for per power source (AC / battery) laptop power settings, built on TLP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kenan Güler" }]
requires-python = ">=3.9"
# Also needs the GTK 4 and libadwaita typelibs from the system, see README.md
dependencies = ["PyGObject>=3.42"]
keywords = ["power", "battery", "tlp", "laptop", "gtk", "libadwaita"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: System :: Power (UPS)",
]

[project.scripts]
powercontrol = "powerctl.cli:main"

[tool.setuptools]
packages = ["powerctl"]

[tool.setuptools.dynamic]
version = { attr = "powerctl.core.VERSION" }
